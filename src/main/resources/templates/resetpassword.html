<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <div class="lado-imagem">
        <img th:src="@{/images/logo.png}" alt="Logo">
    </div>

    <div class="lado-formulario">
        <h1>Nova senha</h1>

        <div class="aviso aviso-erro" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="@{/resetpassword}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <input type="password" name="password" placeholder="Nova senha" required autofocus>
            <input type="password" name="confirmPassword" placeholder="Confirmar nova senha" required>
            <button type="submit">Salvar nova senha</button>
        </form>

        <div class="rodape">
            <a th:href="@{/login}">Voltar ao login</a>
            |
            <a class="laranja" th:href="@{/recoverpassword}">Pedir outro link</a>
        </div>
    </div>
</main>
</body>
</html>
