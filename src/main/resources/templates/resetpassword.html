<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <div class="lado-imagem">
        <img th:src="@{/images/logo.svg}" alt="SecureLogin PUC">
        <span>SecureLogin PUC</span>
    </div>

    <div class="lado-formulario">
        <h1>Nova senha</h1>
        <p class="subtitulo">Defina a nova senha da sua conta</p>

        <div class="aviso aviso-erro" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="@{/resetpassword}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <label for="password">Nova senha</label>
            <input type="password" id="password" name="password" required autofocus>

            <label for="confirmPassword">Confirmar nova senha</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>

            <button type="submit">Salvar nova senha</button>
        </form>

        <div class="rodape">
            <a th:href="@{/login}">Voltar ao login</a>
        </div>
    </div>
</main>
</body>
</html>
