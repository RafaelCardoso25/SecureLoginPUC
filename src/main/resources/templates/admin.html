<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="caixa">
    <h1>Área administrativa</h1>
    <p class="saudacao">Olá, <strong th:text="${username}">admin</strong>.</p>
    <p>Esta página só é acessível para usuários com o perfil ADMIN.</p>

    <div class="acoes">
        <a class="botao-secundario" th:href="@{/home}">Voltar ao início</a>

        <form th:action="@{/logout}" method="post">
            <button type="submit">Sair</button>
        </form>
    </div>
</main>
</body>
</html>
