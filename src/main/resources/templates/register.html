<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <div class="lado-imagem">
        <img th:src="@{/images/logo.svg}" alt="SecureLogin PUC">
        <span>SecureLogin PUC</span>
    </div>

    <div class="lado-formulario">
        <h1>Criar conta</h1>
        <p class="subtitulo">Preencha os dados para se cadastrar</p>

        <div class="aviso aviso-erro" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="@{/register}" method="post">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" th:value="${username}" required autofocus>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:value="${email}" required>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>

            <label for="confirmPassword">Confirmar senha</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>

            <button type="submit">Cadastrar</button>
        </form>

        <div class="rodape">
            Já tem cadastro? <a th:href="@{/login}">Fazer login</a>
        </div>
    </div>
</main>
</body>
</html>
