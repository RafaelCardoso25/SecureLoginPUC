<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <div class="lado-imagem">
        <img th:src="@{/images/logo.png}" alt="Logo">
    </div>

    <div class="lado-formulario">
        <h1>Cadastro</h1>

        <div class="aviso aviso-erro" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="@{/register}" method="post">
            <input type="text" name="username" placeholder="Usuário" th:value="${username}" required autofocus>
            <input type="email" name="email" placeholder="Email" th:value="${email}" required>
            <input type="password" name="password" placeholder="Senha" required>
            <input type="password" name="confirmPassword" placeholder="Confirmar senha" required>
            <button type="submit">Cadastrar</button>
        </form>

        <div class="rodape">
            <p>Já tem cadastro?</p>
            <a th:href="@{/login}">Fazer login</a>
            |
            <a class="laranja" th:href="@{/recoverpassword}">Esqueceu sua senha?</a>
        </div>
    </div>
</main>
</body>
</html>
