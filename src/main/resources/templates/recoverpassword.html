<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <div class="lado-imagem">
        <img th:src="@{/images/logo.png}" alt="Logo">
    </div>

    <div class="lado-formulario">
        <h1>Recuperar senha</h1>

        <div class="aviso aviso-sucesso" th:if="${mensagem}" th:text="${mensagem}"></div>

        <form th:action="@{/recoverpassword}" method="post">
            <input type="email" name="email" placeholder="Email cadastrado" required autofocus>
            <button type="submit">Enviar link de recuperação</button>
        </form>

        <div class="rodape">
            <p>Lembrou sua senha?</p>
            <a th:href="@{/login}">Voltar ao login</a>
            |
            <a class="laranja" th:href="@{/register}">Cadastre-se</a>
        </div>
    </div>
</main>
</body>
</html>
