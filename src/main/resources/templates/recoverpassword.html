<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <div class="lado-imagem">
        <img th:src="@{/images/logo.svg}" alt="SecureLogin PUC">
        <span>SecureLogin PUC</span>
    </div>

    <div class="lado-formulario">
        <h1>Recuperar senha</h1>
        <p class="subtitulo">Informe o email usado no seu cadastro</p>

        <div class="aviso aviso-sucesso" th:if="${mensagem}" th:text="${mensagem}"></div>

        <form th:action="@{/recoverpassword}" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>

            <button type="submit">Enviar link de recuperação</button>
        </form>

        <div class="rodape">
            Lembrou sua senha? <a th:href="@{/login}">Voltar ao login</a>
        </div>
    </div>
</main>
</body>
</html>
