<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <div class="lado-imagem">
        <img th:src="@{/images/logo.svg}" alt="SecureLogin PUC">
        <span>SecureLogin PUC</span>
    </div>

    <div class="lado-formulario">
        <h1>Entrar</h1>
        <p class="subtitulo">Acesse sua conta para continuar</p>

        <div class="aviso aviso-erro" th:if="${param.error}">Usuário ou senha inválidos.</div>
        <div class="aviso aviso-sucesso" th:if="${param.logout}">Sessão encerrada com sucesso.</div>
        <div class="aviso aviso-sucesso" th:if="${param.registered}">Cadastro realizado! Faça seu login.</div>
        <div class="aviso aviso-sucesso" th:if="${param.reset}">Senha alterada! Faça seu login.</div>

        <form th:action="@{/login}" method="post">
            <label for="username">Usuário ou email</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Entrar</button>
        </form>

        <div class="rodape">
            Ainda não tem cadastro? <a th:href="@{/register}">Cadastre-se</a>
        </div>
        <div class="rodape">
            <a th:href="@{/recoverpassword}">Esqueceu sua senha?</a>
        </div>
    </div>
</main>
</body>
</html>
